name: Get Citation Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/google_scholar_crawler.yaml'
      - 'google_scholar_crawler/**'
      - '_pages/about.md'
      - '_config.yml'
  schedule:
    - cron: '0 8 * * *'

concurrency:
  group: get-citation-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Install Python deps
      run: |
        cd google_scholar_crawler
        python3 -m pip install -r requirements.txt

    - name: Fetch Google Scholar
      continue-on-error: true
      run: |
        cd google_scholar_crawler
        if ! timeout 180 python3 -u main.py; then
          echo "Google Scholar fetch failed or timed out, skipping."
        fi
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}

    - name: Fetch Semantic Scholar API
      run: |
        cd google_scholar_crawler
        timeout 60 python3 -u semantic_scholar_crawler.py
      env:
        SEMANTIC_SCHOLAR_AUTHOR_ID: ${{ secrets.SEMANTIC_SCHOLAR_AUTHOR_ID }}
        SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}

    - name: Ensure Google Scholar fallback file exists
      if: always()
      run: |
        mkdir -p google_scholar_crawler/results
        if [ ! -f google_scholar_crawler/results/gs_data_shieldsio.json ]; then
          echo '{"schemaVersion": 1, "label": "citations", "message": "90"}' > google_scholar_crawler/results/gs_data_shieldsio.json
        fi
    
    - name: Push JSON files
      if: always()
      run: |
        mkdir -p google_scholar_crawler/results
        cd google_scholar_crawler/results
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add .
        git commit -m "Updated Citation Data" || echo "No changes to commit"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
